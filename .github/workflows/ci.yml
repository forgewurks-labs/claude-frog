name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is the primary dev platform, so it runs the same matrix as
        # Linux. Oldest supported through current — the floor must match
        # requires-python in pyproject.toml. The frog is stdlib-only, so this
        # is really a "does it still parse and render everywhere" gate.
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Byte-compile (syntax gate)
        run: python -m compileall -q claude_frog.py tests
      - name: Run tests
        run: python -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ruff (ruleset pinned in pyproject.toml)
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.2"

  package:
    # Proves the pyproject packaging: `pip install .` succeeds and the
    # `claude-frog` console entry point lands on PATH and answers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: pip install . and smoke-test the entry point
        run: |
          python -m pip install --quiet .
          test "$(claude-frog resolve-theme SEGA)" = genesis
